# Licences the dependencies may carry; `cargo deny check licenses sources` fails on any other.
[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
  "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
# This package itself is proprietary and not published.
ignore = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
